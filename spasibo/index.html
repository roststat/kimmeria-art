<nav>
  <a href="/" class="nav-logo">Киммерия-Арт</a>
</nav>
<div class="card" id="card">
  <div class="icon" id="icon">🎬</div>
  <h1 class="title" id="title">Вы записаны!</h1>
  <p class="subtitle">Спасибо! Мы получили вашу заявку. В ближайшее время с вами свяжется менеджер для подтверждения записи и уточнения деталей.</p>
  <div class="details" id="details"></div>

  <button class="btn-share" id="shareBtn" onclick="shareInfo()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    Поделиться
  </button>
  <div class="share-toast" id="shareToast">Скопировано в буфер обмена!</div>
</div>
<div id="site-footer"></div>

<script>
// Конфиг курсов — при добавлении нового курса просто добавить блок сюда
var COURSES = {
  'kurs-mikrodram': {
    accent: '#1a4a3a',
    accentLight: '#e8f4f0',
    accentText: '#1a4a3a',
    icon: '🎬',
    title: 'Вы записаны на курс!',
    rows: [
      { key: 'Курс',       val: 'Как создать микродраму' },
      { key: 'Начало',     val: '12 мая 2026' },
      { key: 'Расписание', val: 'Вт и Сб · 18:00' },
      { key: 'Формат',     val: '8 встреч · 4 недели' },
      { key: 'Стоимость',  val: '15 000 ₽' }
    ],
    url: '/kurs-mikrodram/',
    shareText: 'Я записалась на курс «Как создать микродраму» в Кинокомпании «Киммерия»!\n\n📅 Начало: 12 мая 2026\n🕕 Вт и Сб, 18:00\n🎬 8 встреч · 4 недели\n📍 Ялта\n\nhttps://art-kimmeria.ru/kurs-mikrodram/'
  },
  'kino-intensiv': {
    accent: '#c8360a',
    accentLight: '#fdf0ec',
    accentText: '#c8360a',
    icon: '🎥',
    title: 'Вы записаны на интенсив!',
    rows: [
      { key: 'Курс',       val: 'Летний киноинтенсив для подростков' },
      { key: 'Начало',     val: '3 июня 2026' },
      { key: 'Расписание', val: 'Пн, Ср, Пт · 12:00–15:00' },
      { key: 'Длительность', val: '5 недель · 15 занятий' },
      { key: 'Адрес',     val: 'Ялта, ул. Игнатенко, 5' },
      { key: 'Стоимость',  val: 'от 5 000 ₽ в неделю' }
    ],
    url: '/kino-intensiv/',
    shareText: 'Мой ребёнок идёт на Летний киноинтенсив в Киношколу «Киммерия»!\n\n📅 3 июня — 5 июля 2026\n🕛 Пн, Ср, Пт · 12:00–15:00\n🎬 Актёрство · Сценарий · Съёмки фильма\n📍 Ялта, ул. Игнатенко, 5\n\nhttps://art-kimmeria.ru/kino-intensiv/'
  }
};

// Дефолт — если курс не определён
var DEFAULT = {
  accent: '#1a4a3a',
  accentLight: '#e8f4f0',
  accentText: '#1a4a3a',
  icon: '🎬',
  title: 'Вы записаны!',
  rows: [
    { key: 'Статус', val: 'Заявка принята' }
  ],
  url: '/',
  shareText: 'Я записалась на мероприятие Кинокомпании «Киммерия»! https://art-kimmeria.ru'
};

var from = new URLSearchParams(window.location.search).get('from') || '';
var cfg = COURSES[from] || DEFAULT;

// Применяем цвета
document.getElementById('icon').textContent = cfg.icon;
document.getElementById('title').textContent = cfg.title;

var details = document.getElementById('details');
details.style.background = cfg.accentLight;
var html = '';
cfg.rows.forEach(function(r) {
  html += '<div class="details-row">'
    + '<span class="details-key" style="color:' + cfg.accentText + '">' + r.key + '</span>'
    + '<span class="details-val">' + r.val + '</span>'
    + '</div>';
});
details.innerHTML = html;

var btn = document.getElementById('backBtn');
btn.style.background = cfg.accent;

var shareBtn = document.getElementById('shareBtn');
shareBtn.style.color = cfg.accent;
shareBtn.style.borderColor = cfg.accent;

var toast = document.getElementById('shareToast');
toast.style.color = cfg.accent;

function goBack() {
  var ref = document.referrer;
  if (ref && ref.indexOf(location.hostname) !== -1 && ref.indexOf('/spasibo') === -1) {
    history.back();
  } else {
    window.location.href = cfg.url;
  }
}

function shareInfo() {
  if (navigator.share) {
    navigator.share({ title: cfg.title, text: cfg.shareText });
  } else {
    navigator.clipboard.writeText(cfg.shareText).then(function() {
      toast.style.display = 'block';
      setTimeout(function() { toast.style.display = 'none'; }, 3000);
    });
  }
}
</script>
<script src="/footer.js"></script>
